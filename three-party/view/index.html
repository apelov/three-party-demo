<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-src="copy:app.title"></title>
<link rel="stylesheet" href="./view.css">
<script type="module" src="./view.mjs"></script>
</head>
<body data-mode="story" data-size="inspect" data-tier="standard" data-ready="no">
<header class="topbar" id="topbar">
  <h1 class="app-title" id="app-title"></h1>
</header>
<nav class="pane pane-left" id="pane-left" aria-labelledby="scenes-heading"></nav>
<div class="switches" id="switches">
  <div class="mode-switch" id="mode-switch" role="group"></div>
  <div class="view-switch" id="view-switch" role="group"></div>
</div>
<div class="run-line" id="run-line"></div>
<main class="pane pane-flow" id="pane-flow" aria-labelledby="app-title">
  <section class="invoice" id="invoice"></section>
  <div class="flow" id="flow">
    <div class="lanes-head" id="lanes-head"></div>
    <div class="rows" id="rows" role="list"></div>
    <div class="trace" id="trace" hidden></div>
    <div class="flow-space" id="flow-space"></div>
    <section class="outcome outcome-end" id="outcome-end"></section>
  </div>
</main>
<aside class="pane pane-inspector" id="pane-inspector" aria-labelledby="inspector-heading"></aside>
<footer class="footer" id="footer"></footer>
<div class="live" id="live" aria-live="polite" role="status"></div>
</body>
</html>
